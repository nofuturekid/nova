name: Action Lint

# Advisory workflow-YAML linter. Closes audit finding 4: nothing validated
# the workflow files themselves, which is how two CodeQL-config bugs and the
# dead `else` branch in ci.yml shipped. actionlint catches YAML/expression/
# shellcheck mistakes in `.github/workflows/**`.
#
# DELIBERATELY ADVISORY: this is NOT in branch-protection required checks —
# `build` (ci.yml) stays the single required check (ADR-0003). Mirrors the
# CodeQL-advisory posture (ADR-0022). Path-scoped so it only runs when a
# workflow file actually changes.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        run: |
          set -euo pipefail
          # Pinned release tarball with a verified SHA-256 (rhysd/actionlint
          # ships no composite action; Dependabot does not track this, so
          # bump version + checksum together by hand).
          VER=1.7.7
          SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
