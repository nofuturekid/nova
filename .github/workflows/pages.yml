name: Pages

# Publishes the project website (site/) to GitHub Pages. The screenshots
# and the icon are not stored twice: this workflow copies them from the
# F-Droid/Play listing (fastlane/metadata/android/en-US/images) into
# assets/ of the site. See ADR-0033 (amendment 2026-11-12).

on:
  push:
    branches: [main]
    paths:
      - site/**
      - fastlane/metadata/android/en-US/images/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Least-privilege (ADR-0022): only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel an in-flight deploy on
# main (ADR-0011 — cancel-in-progress is for PR branches, not main).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        # enablement:true turns Pages on (build type "workflow") on the
        # first run via the merged-and-authorised workflow itself — no
        # out-of-band repo-settings change. Documented in ADR-0033.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Assemble the site
        run: |
          IMG=fastlane/metadata/android/en-US/images
          for f in index.html style.css favicon.svg fonts/geist-latin.woff2 fonts/geist-mono-latin.woff2 fonts/geist-OFL.txt; do test -f "site/$f"; done
          rm -rf dist/pages
          mkdir -p dist/pages/assets/screenshots
          cp -R site/. dist/pages/
          cp "$IMG/icon.png" dist/pages/assets/icon.png
          for n in 1 2 3 4 5 6; do cp "$IMG/phoneScreenshots/$n.png" dist/pages/assets/screenshots/; done
          touch dist/pages/.nojekyll
      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
