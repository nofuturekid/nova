name: CI

# ci.yml runs only on PRs (the gating signal for the `main` rulesets) and on
# manual dispatch (for backfill / rebuild of a specific commit). It does
# NOT run on push:main — a PR lands by a fast-forward push of its own head
# commit, so a push run would rebuild the exact commit the PR-CI just built
# minutes earlier, wasting ~5 minutes per code PR.
#
# release.yml finds the successful run by the tagged commit's SHA (the PR
# head that was fast-forwarded onto main); see ADR-0014.
#
# The aggregate job `build` reports as the check `build` on pull_request
# and as `build (dispatch)` on workflow_dispatch (ADR-0003 amendment
# 2026-11-13). The rulesets require the context `build`, so a manual run
# can never satisfy them.
#
# Job structure (ADR-0019): `setup` runs first and gates everything else.
# It builds only when a *build-affecting* path changed — an inverted
# allowlist (ADR-0029, supersedes ADR-0009's docs deny-list). `build-debug`
# and the release job run in parallel — independent compilations. Each sets
# up its own Gradle cache via `gradle/actions/setup-gradle` with
# `cache-read-only` on PRs, so untrusted fork PRs can't write it. ADR-0018
# was Reversed 2026-05-17 and its dedicated cache-warm.yml deleted; the only
# writer left is dependency-submission.yml on push to main (observed since
# 2026-11-10), whose cache key is a hash of the Gradle files. A PR that
# changes those files (every Dependabot and release PR does) misses that
# entry and builds cold. `build` is a tiny aggregator that the `main`
# ruleset requires as the single status check. Two jobs run on every run,
# whatever changed (ADR-0029 amendment 2026-11-13): `ci-lint` (workflow,
# shell, Renovate-config and commit-message checks) and `release-check`
# (version-bump preflight, no Gradle). `build` accepts only `success` from
# both.
#
# Release signing (ADR-0004, amendment 2026-11-12): signing runs in its own
# job, `build-release`, whose job-level `if` admits only manual dispatch and
# same-repo pull requests AUTHORED by a human. The decision is made on the
# immutable `github` context before any runner starts, so no step can change
# it and, for every other run, no runner receives the signing secrets at all.
# Pull requests authored by a bot (Dependabot, Renovate, ...) and fork pull
# requests run `build-release-unsigned` instead (the exact negation): it
# references no secret and compiles the minified release variant of both
# flavors, debug-signed by the fallback in app/build.gradle.kts. Why the
# author and not `github.actor`: a human re-run or "update branch" on a bot
# pull request changes the actor but not the author. GitHub withholds
# secrets from Dependabot pull requests by itself; other bots that push
# same-repo branches (the Renovate app, installed for the organization) are
# not covered by that, hence the explicit rule here.
on:
  pull_request:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# CI only checks out + builds + uploads artifacts within the same run —
# read access to repo contents is all it needs.
permissions:
  contents: read

# Unconditional cancel-in-progress is correct here: ADR-0011's
# `${{ github.ref != 'refs/heads/main' }}` carve-out is mooted by ADR-0014
# (ci.yml no longer runs on push:main, so there is never a main-ref run to
# protect). See ADR-0011's 2026-05-17 superseded note for the reconciliation.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history so docs-only diff works on PRs and pushes

      # Build only when a build-affecting path changed (ADR-0029, an
      # inverted allowlist that supersedes ADR-0009's docs deny-list).
      # The aggregator `build` job reads `setup.outputs.code`, so branch
      # protection's single required check stays SUCCESS without spinning
      # up the parallel compile jobs. A manual dispatch always does a full
      # build. On a pull request the diff is taken against the
      # merge base with origin/main, not against the PR's base commit, so a PR
      # stacked on an unbuilt branch, or one whose base is behind main, still
      # builds everything that main does not already contain. It fails
      # closed: if the merge base cannot be computed, or the diff is empty,
      # the step fails and `build` cannot pass (ADR-0029 amendment
      # 2026-11-13).
      - name: Detect build-affecting change
        id: filter
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch → full build."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD="${{ github.event.pull_request.head.sha }}"
            if ! BASE=$(git merge-base origin/main "$HEAD") || [ -z "$BASE" ]; then
              echo "::error::Cannot compute the merge base of origin/main and $HEAD — failing closed instead of guessing a diff (ADR-0029)."
              exit 1
            fi
          else
            # Unreachable: ci.yml triggers are pull_request + workflow_dispatch
            # only (no push:main — ADR-0014). workflow_dispatch is fully
            # handled above. Any other event_name reaching here means the
            # trigger set changed without updating this logic — fail loud
            # (Rule 12) rather than silently diffing against an empty BASE.
            echo "::error::Unexpected event '${{ github.event_name }}' in setup diff — ci.yml triggers changed without updating this step (ADR-0014)."
            exit 1
          fi
          # --no-renames: a rename out of a build-affecting path (app/ -> docs/)
          # must list the OLD path too, or the allowlist below would only see
          # the docs path and skip the build.
          CHANGED=$(git diff --name-only --no-renames "$BASE" "$HEAD")
          if [ -z "$CHANGED" ]; then
            echo "::error::Empty diff between merge base $BASE and $HEAD — nothing to gate; failing closed (ADR-0029)."
            exit 1
          fi
          echo "Merge base: $BASE"
          echo "Changed files:"
          echo "  ${CHANGED//$'\n'/$'\n'  }"
          # INVERTED allowlist (ADR-0029): enumerate ONLY the small, stable
          # set of build-affecting / shipping paths. Any changed file
          # matching this → full build; everything else (docs, scripts/,
          # docker/, tooling, editor/AI config, …) → skip the APK build.
          #
          # We maintain this short list instead of an ever-growing
          # non-shipping deny-list. Safety net: release.yml fails loudly if
          # a tagged commit has no successful CI build, so a mis-skip can
          # never silently ship (ADR-0004). CONVENTION: introducing a new
          # buildable module/path REQUIRES adding it here in the SAME PR
          # (same discipline ADR-0003 uses for the `build` job name).
          #
          #   ^app/                  app source, res, manifest, app/build.gradle.kts, proguard
          #   ^gradle/               version catalog (libs.versions.toml) + wrapper
          #   ^gradlew, ^gradlew.bat wrapper launchers
          #   ^settings.gradle.kts   module graph
          #   ^build.gradle.kts      root build script
          #   ^gradle.properties     build flags (KSP, caching, jvmargs, …)
          #   ^.github/workflows/ci.yml  ONLY ci.yml among workflows is
          #     build-affecting (ADR-0029 amendment 2026-05-17): a ci.yml
          #     change should be validated by a real build, but actionlint/
          #     codeql/release/dependency-submission changes cannot affect
          #     whether the app compiles — treat them as non-build (docs-like).
          BUILD_AFFECTING=$(echo "$CHANGED" | grep -E '^app/|^gradle/|^gradlew$|^gradlew\.bat$|^settings\.gradle\.kts$|^build\.gradle\.kts$|^gradle\.properties$|^\.github/workflows/ci\.yml$' || true)
          if [ -n "$BUILD_AFFECTING" ]; then
            echo "Build-affecting files changed → full build:"
            echo "  build: ${BUILD_AFFECTING//$'\n'/$'\n'  build: }"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No build-affecting change — skipping APK build (ADR-0029)."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-debug:
    needs: setup
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (build cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      # Debug build = the `direct` flavor variant (status-quo dev cycle).
      # Store-flavor debug builds add no signal — same code path minus the
      # updater UI — so we skip them at debug to keep CI lean (ADR-0040).
      - name: Assemble debug + lint
        run: ./gradlew :app:assembleDirectDebug :app:lintDirectDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/direct/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-directDebug.html
          retention-days: 14
          if-no-files-found: warn

  # Signed release build: manual dispatch and same-repo pull requests
  # AUTHORED by a human only (ADR-0004, amendment 2026-11-12). The job-level
  # `if` reads the immutable `github` context before any runner starts: no
  # step can flip it, and on any other run this job never starts, so no
  # runner ever receives the signing secrets.
  build-release:
    needs: setup
    if: >-
      needs.setup.outputs.code == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot' &&
        !endsWith(github.event.pull_request.user.login, '[bot]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (build cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 is empty on a run that must sign — secret missing or renamed; refusing to pass the gate without a signed release APK."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      # Release build = both flavors (ADR-0040): `assembleRelease` builds
      # every release variant — currently direct + store — with R8
      # minification, signed with the release key. Only the `direct` APK is
      # uploaded to GitHub Releases (release.yml); the `store` APK is built by
      # F-Droid themselves from source (and later by Play App Signing), so
      # it's a compile-only gate.
      - name: Build release APKs (direct + store)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release APK signature (direct flavor)
        run: |
          BT="$ANDROID_HOME/build-tools"
          LATEST=$(find "$BT" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/direct/release -maxdepth 1 -name '*.apk' | sort | head -1)
          "$BT/$LATEST/apksigner" verify --verbose "$APK"

      # release.yml downloads this artifact (name `app-release`) to ship
      # to GitHub Releases — only the `direct` flavor APK goes here.
      - name: Upload release APK (direct flavor)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release
          path: app/build/outputs/apk/direct/release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload mapping (direct flavor)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping
          path: app/build/outputs/mapping/directRelease/mapping.txt
          retention-days: 90
          if-no-files-found: error

  # Compile-only release build for bot-authored and fork pull requests: the
  # exact negation of build-release's condition. No `secrets.` reference
  # anywhere in this job. app/build.gradle.kts falls back to debug signing
  # because app/release.keystore does not exist.
  build-release-unsigned:
    needs: setup
    if: >-
      needs.setup.outputs.code == 'true' &&
      !(github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.user.type != 'Bot' &&
         !endsWith(github.event.pull_request.user.login, '[bot]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (build cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Build release APKs (direct + store, debug-signed fallback)
        run: ./gradlew :app:assembleRelease --stacktrace

      # Prove both minified release APKs exist, so a build that "succeeds"
      # without producing them cannot pass.
      - name: Check release APKs exist (direct + store)
        run: |
          for flavor in direct store; do
            APK=$(find "app/build/outputs/apk/$flavor/release" -maxdepth 1 -name '*.apk' 2>/dev/null | sort | head -1)
            if [ -z "$APK" ]; then
              echo "::error::No release APK for flavor $flavor — assembleRelease produced nothing."
              exit 1
            fi
            echo "Compiled (debug-signed fallback): $APK"
          done

  # Unit tests (ADR-0036). The repo carries real JVM unit tests
  # (app/src/test/...: UpdateControllerTest, StaleCrossServerTest) plus
  # JUnit + kotlinx-coroutines-test deps, but CI previously only
  # assembled/linted and never executed them — regressions in the test
  # backlog (#18–22) could not be caught. This job runs the Gradle unit
  # tests in parallel with build-debug/build-release (ADR-0019 pattern)
  # and gates the required `build` aggregator below, so a failing test
  # blocks the merge through the EXISTING required check (no
  # branch-protection change — ADR-0027 Tier-2 / ADR-0003). Same skip gate
  # (setup.outputs.code) and setup/cache structure as the build jobs.
  test:
    needs: setup
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (build cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      # Unit tests live in app/src/test/ (shared across flavors). The
      # Gradle task name picks up the flavor: testDirectDebugUnitTest —
      # same source set, same outcome (ADR-0040). Store-flavor unit tests
      # are skipped: identical sources would produce identical results.
      - name: Run unit tests
        run: ./gradlew :app:testDirectDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: app/build/reports/tests/testDirectDebugUnitTest
          retention-days: 14
          if-no-files-found: warn

  # Repository checks that run on EVERY run, whatever changed (ADR-0029
  # amendment 2026-11-13). No `needs: setup`: a docs-only or bot pull request
  # skips the Gradle jobs but never these, and a failed `setup` does not skip
  # them. `build` accepts only `success` from this job.
  #   - actionlint over all workflows (moved here from actionlint.yml, which
  #     was advisory; ADR-0022 amendment 2026-11-13)
  #   - shellcheck over .github/scripts/*.sh
  #   - renovate-config-validator, only when renovate.json changed
  #   - no session link or session trailer in any commit message of the
  #     range merge-base..head (the two patterns of nova-pr.js, composed from
  #     two quoted halves so that this file never contains them literally)
  ci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge base with origin/main and the commit range need history
          persist-credentials: false

      - name: Compute merge base
        id: base
        run: |
          set -euo pipefail
          if ! BASE=$(git merge-base origin/main "$HEAD_SHA") || [ -z "$BASE" ]; then
            echo "::error::Cannot compute the merge base of origin/main and $HEAD_SHA — failing closed."
            exit 1
          fi
          echo "Merge base: $BASE"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      # A pinned shellcheck, not the runner image's: the image's version
      # drifts (the one on ubuntu-latest still reports SC2015 as an info
      # note, 0.11.0 does not) and would turn a runner update into a red
      # gate. Put on PATH first, so actionlint (which runs shellcheck on the
      # `run:` blocks) and the shellcheck step below use the same binary.
      - name: Install shellcheck (pinned)
        run: |
          set -euo pipefail
          VER=0.11.0
          SHA256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v${VER}/shellcheck-v${VER}.linux.x86_64.tar.xz"
          echo "${SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shellcheck-bin"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck-bin" --strip-components=1 "shellcheck-v${VER}/shellcheck"
          echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-bin/shellcheck" --version

      - name: actionlint (all workflows)
        run: |
          set -euo pipefail
          # Pinned release tarball with a verified SHA-256 (rhysd/actionlint
          # ships no composite action; Renovate does not track this, so
          # bump version + checksum together by hand).
          VER=1.7.7
          SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: shellcheck (.github/scripts)
        run: shellcheck .github/scripts/*.sh

      - name: Did renovate.json change?
        id: renovate
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- renovate.json; then
            echo "renovate.json unchanged — skipping the validator."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "renovate.json changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # renovate needs Node 24 or newer.
      - name: Set up Node.js
        if: steps.renovate.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Exact version, bumped by hand together with the actionlint pin above.
      - name: Validate renovate.json
        if: steps.renovate.outputs.changed == 'true'
        run: npx --yes --package renovate@44.195.1 -- renovate-config-validator --strict

      - name: No session links or trailers in commit messages
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # Same two patterns as LINK_PATTERN and TRAILER_PATTERN in
          # .claude/workflows/nova-pr.js (R-TRAILER, rule R14 of issue 295),
          # joined from two quoted halves.
          LINK_PATTERN='claude''\.ai/code'
          TRAILER_PATTERN='Claude''-Session'
          BAD=$(git log -E --grep="$LINK_PATTERN|$TRAILER_PATTERN" --format='%h' "$BASE_SHA..$HEAD_SHA")
          if [ -n "$BAD" ]; then
            echo "::error::These commits carry a session link or a session trailer in their message (R-TRAILER): ${BAD//$'\n'/ }. Reword them and force-push the branch."
            exit 1
          fi
          echo "ok: no commit in $BASE_SHA..$HEAD_SHA carries a session link or trailer."

  # Version-bump preflight on the pull request, no Gradle (issue 295,
  # decision f). Exits 0 when versionName is unchanged against the merge
  # base; otherwise release-preflight.sh checks the new version (shape,
  # versionCode, free tag name, CHANGELOG section), the same script the
  # release run will use. `build` accepts only `success` from this job.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge base, tags and the previous release tag need history
          persist-credentials: false

      - name: Check a version bump
        run: |
          set -euo pipefail
          if ! BASE=$(git merge-base origin/main "$HEAD_SHA") || [ -z "$BASE" ]; then
            echo "::error::Cannot compute the merge base of origin/main and $HEAD_SHA — failing closed."
            exit 1
          fi
          version_name() { # $1 = commit; fails if app/build.gradle.kts is missing there
            git show "$1:app/build.gradle.kts" \
              | sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' | sort -u
          }
          OLD=$(version_name "$BASE")
          NEW=$(version_name "$HEAD_SHA")
          if [ "$OLD" = "$NEW" ]; then
            echo "versionName unchanged against the merge base ($NEW) — no release preflight needed."
            exit 0
          fi
          echo "versionName changes from '$OLD' to '$NEW' — running the release preflight."
          bash .github/scripts/release-preflight.sh "$HEAD_SHA"

  # Aggregator job — the `main` ruleset's single required status check.
  # Passes if setup said docs-only (no compile needed) OR both build jobs
  # AND the unit-test job succeeded; ci-lint and release-check must always
  # have succeeded. Lets us add/remove parallel jobs in the future without
  # having to update the ruleset.
  #
  # The job id stays `build`; the displayed name, which is the check context
  # the ruleset matches, is `build` only on pull_request. A manual run
  # reports `build (dispatch)` and so can never satisfy the ruleset.
  build:
    name: ${{ github.event_name == 'pull_request' && 'build' || 'build (dispatch)' }}
    needs:
      [
        setup,
        ci-lint,
        release-check,
        build-debug,
        build-release,
        build-release-unsigned,
        test,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate result
        env:
          DOCS_ONLY: ${{ needs.setup.outputs.code != 'true' }}
          SETUP_RESULT: ${{ needs.setup.result }}
          LINT_RESULT: ${{ needs.ci-lint.result }}
          RELEASE_CHECK_RESULT: ${{ needs.release-check.result }}
          DEBUG_RESULT: ${{ needs.build-debug.result }}
          RELEASE_RESULT: ${{ needs.build-release.result }}
          UNSIGNED_RESULT: ${{ needs.build-release-unsigned.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # `setup` must always have succeeded — it computes the gate output
          # this whole job reads. A failed/cancelled setup is never a pass.
          if [ "$SETUP_RESULT" != "success" ]; then
            echo "::error::setup did not succeed (result=$SETUP_RESULT)."
            exit 1
          fi

          # ci-lint and release-check run on every run, docs-only included,
          # and accept nothing but success (a skip is not a pass either).
          if [ "$LINT_RESULT" != "success" ]; then
            echo "::error::ci-lint did not succeed (result=$LINT_RESULT)."
            exit 1
          fi
          if [ "$RELEASE_CHECK_RESULT" != "success" ]; then
            echo "::error::release-check did not succeed (result=$RELEASE_CHECK_RESULT)."
            exit 1
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "::notice::No build-affecting change — APK build skipped (ADR-0029). No version bump required."
            exit 0
          fi

          # Build-affecting change → debug MUST succeed (it never needs
          # secrets, so a fork PR debug build is just as valid as ours).
          if [ "$DEBUG_RESULT" != "success" ]; then
            echo "::error::Debug build did not succeed (result=$DEBUG_RESULT)."
            exit 1
          fi

          # Unit tests MUST succeed (ADR-0036). Like build-debug, the test
          # job needs no secrets, so a fork PR run is just as valid as
          # ours — a failing/cancelled test job blocks the required gate.
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::Unit tests did not succeed (result=$TEST_RESULT)."
            exit 1
          fi

          # Release contract (ADR-0004, amendment 2026-11-12): on a
          # build-affecting run EXACTLY ONE release job runs (their `if`s are
          # negations) and it must succeed: signed for human same-repo PRs and
          # dispatch, debug-signed compile for bot-authored and fork PRs.
          if { [ "$RELEASE_RESULT" = "success" ] && [ "$UNSIGNED_RESULT" = "skipped" ]; } \
             || { [ "$RELEASE_RESULT" = "skipped" ] && [ "$UNSIGNED_RESULT" = "success" ]; }; then
            echo "Gate passed — debug=$DEBUG_RESULT release=$RELEASE_RESULT release-unsigned=$UNSIGNED_RESULT test=$TEST_RESULT."
            exit 0
          fi
          echo "::error::Release build did not succeed — release=$RELEASE_RESULT release-unsigned=$UNSIGNED_RESULT (expected exactly one success, the other skipped)."
          exit 1
