name: CI

# ci.yml runs only on PRs (the gating signal for branch protection) and on
# manual dispatch (for backfill / rebuild of a specific commit). It does
# NOT run on push:main — the squash-merge would otherwise rebuild the
# exact same source the PR-CI just built minutes earlier under a different
# SHA, wasting ~5 minutes per code PR.
#
# release.yml resolves the artifact via the PR# embedded in the merge
# commit's message; see ADR-0014.
#
# Job structure (ADR-0019): `setup` runs first and gates everything else.
# It builds only when a *build-affecting* path changed — an inverted
# allowlist (ADR-0029, supersedes ADR-0009's docs deny-list). `build-debug`
# and `build-release` run in parallel — independent compilations. Each sets
# up its own Gradle cache via `gradle/actions/setup-gradle` with
# `cache-read-only` on PRs, so untrusted fork PRs can't write it. ADR-0018
# was Reversed 2026-05-17 and its dedicated cache-warm.yml deleted; the only
# writer left is dependency-submission.yml on push to main (observed since
# 2026-11-10), whose cache key is a hash of the Gradle files. A PR that
# changes those files (every Dependabot and release PR does) misses that
# entry and builds cold. `build` is a tiny aggregator that branch
# protection requires as the single status check.
#
# Release signing (ADR-0004, amendment 2026-11-12): the release keystore
# secrets reach the job environment only for manual dispatch and for
# same-repo pull requests AUTHORED by a human. Pull requests authored by a
# bot (Dependabot, Renovate, ...) and fork pull requests still COMPILE the
# minified release variant of both flavors, but debug-signed by the
# fallback in app/build.gradle.kts, and skip signing, the signature check
# and the `app-release` upload. Why the author and not `github.actor`: a
# human re-run or "update branch" on a bot pull request changes the actor
# but not the author, and the secrets must stay away from third-party
# build code whoever pressed the button. GitHub withholds secrets from
# Dependabot pull requests by itself; other bots that push same-repo
# branches (the Renovate app, installed for the organization) are not
# covered by that, hence the explicit rule here.
on:
  pull_request:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# CI only checks out + builds + uploads artifacts within the same run —
# read access to repo contents is all it needs.
permissions:
  contents: read

# Unconditional cancel-in-progress is correct here: ADR-0011's
# `${{ github.ref != 'refs/heads/main' }}` carve-out is mooted by ADR-0014
# (ci.yml no longer runs on push:main, so there is never a main-ref run to
# protect). See ADR-0011's 2026-05-17 superseded note for the reconciliation.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need history so docs-only diff works on PRs and pushes

      # Build only when a build-affecting path changed (ADR-0029, an
      # inverted allowlist that supersedes ADR-0009's docs deny-list).
      # The aggregator `build` job reads `setup.outputs.code`, so branch
      # protection's single required check stays SUCCESS without spinning
      # up the parallel compile jobs. Falls back to a full build whenever
      # we can't reliably diff (force-push, new branch, manual dispatch).
      - name: Detect build-affecting change
        id: filter
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch → full build."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            # Unreachable: ci.yml triggers are pull_request + workflow_dispatch
            # only (no push:main — ADR-0014). workflow_dispatch is fully
            # handled above. Any other event_name reaching here means the
            # trigger set changed without updating this logic — fail loud
            # (Rule 12) rather than silently diffing against an empty BASE.
            echo "::error::Unexpected event '${{ github.event_name }}' in setup diff — ci.yml triggers changed without updating this step (ADR-0014)."
            exit 1
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No diff base (force-push / new branch) → full build."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a rename out of a build-affecting path (app/ -> docs/)
          # must list the OLD path too, or the allowlist below would only see
          # the docs path and skip the build.
          CHANGED=$(git diff --name-only --no-renames "$BASE" "$HEAD")
          echo "Changed files:"
          echo "  ${CHANGED//$'\n'/$'\n'  }"
          # INVERTED allowlist (ADR-0029): enumerate ONLY the small, stable
          # set of build-affecting / shipping paths. Any changed file
          # matching this → full build; everything else (docs, scripts/,
          # docker/, tooling, editor/AI config, …) → skip the APK build.
          #
          # We maintain this short list instead of an ever-growing
          # non-shipping deny-list. Safety net: release.yml fails loudly if
          # a tagged commit has no successful CI build, so a mis-skip can
          # never silently ship (ADR-0004). CONVENTION: introducing a new
          # buildable module/path REQUIRES adding it here in the SAME PR
          # (same discipline ADR-0003 uses for the `build` job name).
          #
          #   ^app/                  app source, res, manifest, app/build.gradle.kts, proguard
          #   ^gradle/               version catalog (libs.versions.toml) + wrapper
          #   ^gradlew, ^gradlew.bat wrapper launchers
          #   ^settings.gradle.kts   module graph
          #   ^build.gradle.kts      root build script
          #   ^gradle.properties     build flags (KSP, caching, jvmargs, …)
          #   ^.github/workflows/ci.yml  ONLY ci.yml among workflows is
          #     build-affecting (ADR-0029 amendment 2026-05-17): a ci.yml
          #     change should be validated by a real build, but actionlint/
          #     codeql/release/dependency-submission changes cannot affect
          #     whether the app compiles — treat them as non-build (docs-like).
          BUILD_AFFECTING=$(echo "$CHANGED" | grep -E '^app/|^gradle/|^gradlew$|^gradlew\.bat$|^settings\.gradle\.kts$|^build\.gradle\.kts$|^gradle\.properties$|^\.github/workflows/ci\.yml$' || true)
          if [ -n "$BUILD_AFFECTING" ]; then
            echo "Build-affecting files changed → full build:"
            echo "  build: ${BUILD_AFFECTING//$'\n'/$'\n'  build: }"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No build-affecting change — skipping APK build (ADR-0029)."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-debug:
    needs: setup
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (build cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      # Debug build = the `direct` flavor variant (status-quo dev cycle).
      # Store-flavor debug builds add no signal — same code path minus the
      # updater UI — so we skip them at debug to keep CI lean (ADR-0040).
      - name: Assemble debug + lint
        run: ./gradlew :app:assembleDirectDebug :app:lintDirectDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/direct/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-directDebug.html
          retention-days: 14
          if-no-files-found: warn

  build-release:
    needs: setup
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The one place that decides whether the release key may be used
      # (see the comment block at the top of this file). Not a secret.
      SIGN_ALLOWED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && !endsWith(github.event.pull_request.user.login, '[bot]')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (build cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      # Release-key gate. SIGN_ALLOWED (job env above) is decided from the
      # pull request AUTHOR, never from github.actor, and every step that
      # touches a signing secret takes it through
      # `env.SIGN_ALLOWED == 'true' && secrets.X || ''`, so the value is an
      # empty string unless signing is allowed. Allowed:
      #   - workflow_dispatch (a maintainer picked the ref on purpose);
      #   - a same-repo pull request whose author is neither of type Bot nor
      #     a login ending in [bot].
      # Everything else (bot-authored PRs incl. Dependabot and Renovate, and
      # fork PRs) compiles unsigned-by-us: see the Gradle fallback below.
      - name: Decode release keystore (if allowed and available)
        id: keystore
        env:
          KEYSTORE_B64: ${{ env.SIGN_ALLOWED == 'true' && secrets.KEYSTORE_B64 || '' }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # Where signing is allowed a missing secret is a misconfiguration
            # and must not turn the gate green with no signed artifact
            # (CI review L5).
            if [ "$SIGN_ALLOWED" = "true" ]; then
              echo "::error::KEYSTORE_B64 is empty although signing is allowed for this run — secret missing or renamed; refusing to pass the gate without a signed release APK."
              exit 1
            fi
            echo "::warning::Release key not used (bot-authored or fork pull request) — compiling the release variant debug-signed, no signing, no app-release artifact"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Release build = both flavors (ADR-0040). `assembleRelease`
      # builds every release variant — currently direct + store — with R8
      # minification, on EVERY run that reaches this job. With the keystore
      # (human same-repo PR, dispatch) the variants are signed with the
      # release key; without it app/build.gradle.kts falls back to the debug
      # signing config, so a bot-authored or fork PR still proves the R8
      # build. Only the `direct` APK is uploaded to GitHub Releases
      # (release.yml); the `store` APK is built by F-Droid themselves from
      # source (and later by Play App Signing), so it's a compile-only gate.
      - name: Build release APKs (direct + store)
        env:
          KEYSTORE_PASSWORD: ${{ env.SIGN_ALLOWED == 'true' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ env.SIGN_ALLOWED == 'true' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ env.SIGN_ALLOWED == 'true' && secrets.KEY_PASSWORD || '' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # Compile-only runs: prove both minified release APKs exist, so a
      # build that "succeeds" without producing them cannot pass.
      - name: Check unsigned-by-us release APKs exist (direct + store)
        if: steps.keystore.outputs.available != 'true'
        run: |
          for flavor in direct store; do
            APK=$(find "app/build/outputs/apk/$flavor/release" -maxdepth 1 -name '*.apk' 2>/dev/null | sort | head -1)
            if [ -z "$APK" ]; then
              echo "::error::No release APK for flavor $flavor — assembleRelease produced nothing."
              exit 1
            fi
            echo "Compiled (debug-signed fallback): $APK"
          done

      - name: Verify release APK signature (direct flavor)
        if: steps.keystore.outputs.available == 'true'
        run: |
          BT="$ANDROID_HOME/build-tools"
          LATEST=$(find "$BT" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/direct/release -maxdepth 1 -name '*.apk' | sort | head -1)
          "$BT/$LATEST/apksigner" verify --verbose "$APK"

      # release.yml downloads this artifact (name `app-release`) to ship
      # to GitHub Releases — only the `direct` flavor APK goes here.
      - name: Upload release APK (direct flavor)
        if: steps.keystore.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release
          path: app/build/outputs/apk/direct/release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload mapping (direct flavor)
        if: steps.keystore.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping
          path: app/build/outputs/mapping/directRelease/mapping.txt
          retention-days: 90
          if-no-files-found: warn

  # Unit tests (ADR-0036). The repo carries real JVM unit tests
  # (app/src/test/...: UpdateControllerTest, StaleCrossServerTest) plus
  # JUnit + kotlinx-coroutines-test deps, but CI previously only
  # assembled/linted and never executed them — regressions in the test
  # backlog (#18–22) could not be caught. This job runs the Gradle unit
  # tests in parallel with build-debug/build-release (ADR-0019 pattern)
  # and gates the required `build` aggregator below, so a failing test
  # blocks the merge through the EXISTING required check (no
  # branch-protection change — ADR-0027 Tier-2 / ADR-0003). Same skip gate
  # (setup.outputs.code) and setup/cache structure as the build jobs.
  test:
    needs: setup
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (build cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      # Unit tests live in app/src/test/ (shared across flavors). The
      # Gradle task name picks up the flavor: testDirectDebugUnitTest —
      # same source set, same outcome (ADR-0040). Store-flavor unit tests
      # are skipped: identical sources would produce identical results.
      - name: Run unit tests
        run: ./gradlew :app:testDirectDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: app/build/reports/tests/testDirectDebugUnitTest
          retention-days: 14
          if-no-files-found: warn

  # Aggregator job — branch protection's single required status check.
  # Passes if setup said docs-only (no compile needed) OR both build jobs
  # AND the unit-test job succeeded. Lets us add/remove parallel jobs in
  # the future without having to update branch-protection config.
  build:
    needs: [setup, build-debug, build-release, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate result
        env:
          DOCS_ONLY: ${{ needs.setup.outputs.code != 'true' }}
          SETUP_RESULT: ${{ needs.setup.result }}
          DEBUG_RESULT: ${{ needs.build-debug.result }}
          RELEASE_RESULT: ${{ needs.build-release.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # `setup` must always have succeeded — it computes the gate output
          # this whole job reads. A failed/cancelled setup is never a pass.
          if [ "$SETUP_RESULT" != "success" ]; then
            echo "::error::setup did not succeed (result=$SETUP_RESULT)."
            exit 1
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "::notice::No build-affecting change — APK build skipped (ADR-0029). No version bump required."
            exit 0
          fi

          # Build-affecting change → debug MUST succeed (it never needs
          # secrets, so a fork PR debug build is just as valid as ours).
          if [ "$DEBUG_RESULT" != "success" ]; then
            echo "::error::Debug build did not succeed (result=$DEBUG_RESULT)."
            exit 1
          fi

          # Unit tests MUST succeed (ADR-0036). Like build-debug, the test
          # job needs no secrets, so a fork PR run is just as valid as
          # ours — a failing/cancelled test job blocks the required gate.
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::Unit tests did not succeed (result=$TEST_RESULT)."
            exit 1
          fi

          # Release contract (ADR-0004, amendment 2026-11-12): build-release
          # runs on EVERY build-affecting run and compiles the minified
          # release variant of both flavors. With the keystore (human
          # same-repo PR, dispatch) it also signs, verifies and uploads
          # `app-release`; for bot-authored and fork PRs it compiles
          # debug-signed and skips those three steps. Either way the job
          # ends `success`. `skipped` is NOT a pass any more: this job's
          # `if` equals the gate above, so a skipped build-release on a
          # build-affecting run means the gate wiring broke, and a failed
          # or cancelled release compilation must block the required check.
          if [ "$RELEASE_RESULT" = "success" ]; then
            echo "Gate passed — debug=$DEBUG_RESULT release=$RELEASE_RESULT test=$TEST_RESULT."
            exit 0
          fi
          echo "::error::Release build did not succeed — release=$RELEASE_RESULT (expected success)."
          exit 1
