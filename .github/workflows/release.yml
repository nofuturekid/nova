name: Release

# 'Build once, promote' — release builds REUSE the APK produced by ci.yml
# for the same commit instead of rebuilding from scratch.
#
# Resolution order for finding the build artifact (ADR-0014):
#   1. Direct lookup: CI run whose head_sha matches the tagged commit
#      (covers manual `gh workflow run ci.yml --ref <tag>` rebuilds).
#   2. PR lookup: parse `(#NN)` from the tagged commit's message,
#      resolve that PR's head SHA via the GitHub API, find its CI run.
#      Covers the normal case — squash-merge commit on main → PR-CI artifact.
#
# Falls back to a clear error message if neither path resolves; recovery
# is a manual workflow_dispatch on the tag. Before anything is downloaded or
# published, release-guard.sh checks tag/commit/CI-run consistency.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

# Serialise releases per tag and never cancel an in-flight one: a release
# job that has started publishing must finish (it writes a user-visible
# GitHub Release). Two `v*` tags pushed close together queue rather than
# race the Release API. Matches the repo convention of every other workflow
# having a concurrency block (audit finding 8).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need history to resolve tag → commit SHA

      - name: Resolve target commit SHA
        id: sha
        run: |
          SHA=$(git rev-parse "${GITHUB_REF#refs/tags/}^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Tag ${GITHUB_REF#refs/tags/} points at $SHA"

      - name: Find CI artifact for this commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # Newest successful ci.yml run for a head SHA that (a) came from a
          # trusted source — `pull_request` from THIS repo (not a fork) or
          # `workflow_dispatch` — and (b) actually has a live `app-release`
          # artifact. A fork PR can reuse a head SHA but never produces the
          # artifact, so it must not shadow the real run (CI review L4).
          # Prints "<run id>" or nothing.
          find_run() {
            local ids id n
            ids=$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$1&status=success&per_page=50" \
              | jq -r --arg repo "$REPO" '.workflow_runs[]
                  | select((.event == "pull_request" or .event == "workflow_dispatch")
                           and .head_repository.full_name == $repo) | .id')
            for id in $ids; do
              n=$(gh api "repos/$REPO/actions/runs/$id/artifacts" \
                --jq '[.artifacts[] | select(.name == "app-release" and (.expired | not))] | length')
              if [ "$n" -gt 0 ]; then echo "$id"; return 0; fi
            done
          }

          # Path 1 — direct: CI run whose head_sha == tagged commit.
          # Hits when someone manually triggered ci.yml on the tag
          # (workflow_dispatch with --ref <tag>). Normal squash-merge commits
          # won't have a direct match and fall through to Path 2.
          RUN_ID=$(find_run "$SHA")
          if [ -n "$RUN_ID" ]; then
            echo "Found CI run $RUN_ID for $SHA (direct match)."
            { echo "id=$RUN_ID"; echo "head_sha=$SHA"; echo "pr_num="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Path 2 — via PR: parse `(#NN)` from the tagged commit's
          # subject line (GitHub's squash-merge format), resolve PR head
          # SHA, look up the PR's CI run. The guard step below verifies the
          # PR really was merged as this commit.
          SUBJECT=$(git log -1 "$SHA" --format=%s)
          PR_NUM=$(echo "$SUBJECT" | grep -oE '\(#[0-9]+\)$' | tr -d '(#)' || true)
          if [ -z "$PR_NUM" ]; then
            echo "::error::No CI run with an app-release artifact for $SHA and no PR # in commit message."
            echo "::error::Subject was: $SUBJECT"
            echo "::error::Direct-push? Run CI manually on the tag with:  gh workflow run ci.yml --ref ${GITHUB_REF#refs/tags/}"
            exit 1
          fi

          PR_SHA=$(gh pr view "$PR_NUM" --json headRefOid --jq '.headRefOid // empty')
          if [ -z "$PR_SHA" ]; then
            echo "::error::Couldn't resolve PR #$PR_NUM head SHA (deleted PR?)."
            exit 1
          fi

          RUN_ID=$(find_run "$PR_SHA")
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful PR CI run with an app-release artifact for SHA $PR_SHA (PR #$PR_NUM)."
            echo "::error::Re-run the PR's CI, then push the tag again."
            exit 1
          fi

          echo "Found PR #$PR_NUM CI run $RUN_ID (head_sha=$PR_SHA)."
          { echo "id=$RUN_ID"; echo "head_sha=$PR_SHA"; echo "pr_num=$PR_NUM"; } >> "$GITHUB_OUTPUT"

      # Refuse to promote an artifact that does not belong to this tag: the
      # commit must be on main, the PR merged as exactly this commit, the CI
      # tree equal to the tagged tree, versionName == tag, versionCode up.
      # Logic lives in .github/scripts/release-guard.sh (CI review H2, ADR-0014).
      - name: Guard — artifact matches tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.sha.outputs.sha }}
          RUN_ID: ${{ steps.run.outputs.id }}
          RUN_HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          PR_NUM: ${{ steps.run.outputs.pr_num }}
        run: .github/scripts/release-guard.sh

      # The `app-release` artifact contains the `direct`-flavor APK only
      # (ADR-0040). CI builds both flavors at release type but uploads
      # only `direct` here — `store` is built by F-Droid themselves from
      # source. The artifact name is unchanged; the file inside is now
      # `app-direct-release.apk` (was `app-release.apk`), which the
      # `Rename APK` step below picks up generically via `find … *.apk`.
      - name: Download release APK from CI run
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: artifacts/apk
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Download mapping from CI run
        uses: actions/download-artifact@v8
        with:
          name: mapping
          path: artifacts/mapping
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Rename APK to include tag
        id: rename
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          APK=$(find artifacts/apk -maxdepth 1 -name '*.apk' | sort | head -1)
          OUT="artifacts/apk/NOVA-${TAG}.apk"
          mv "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Detect pre-release
        id: prerelease
        run: |
          # Pre-release convention: -beta1, -beta2, -rc1, -rc2, -alpha1, ...
          # Number is required so plain `-beta` is rejected, which catches typos.
          TAG=${GITHUB_REF#refs/tags/}
          if echo "$TAG" | grep -qE -- '-(alpha|beta|rc|pre)[0-9]+$'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # Slice the CHANGELOG.md section matching this tag into the release
      # body (ADR-0031). Non-fatal: a missing/empty section just warns and
      # the release still publishes with the appended auto notes. The tag
      # name comes from GITHUB_REF (maintainer-pushed, not untrusted input)
      # and is read via an env var, quoted.
      - name: Extract changelog section
        id: changelog
        env:
          REF: ${{ github.ref }}
        run: |
          set -e
          TAG="${REF#refs/tags/}"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ ("^## \\[" ver "\\]") {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > changelog_section.md || true
          # strip leading/trailing blank lines
          sed -i -e '/./,$!d' changelog_section.md
          if [ ! -s changelog_section.md ]; then
            echo "::warning::No CHANGELOG.md section for $VER — publishing with auto notes only."
          else
            echo "Changelog section for $VER:"
            sed 's/^/  /' changelog_section.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.rename.outputs.apk }}
            artifacts/mapping/mapping.txt
          body_path: changelog_section.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          prerelease: ${{ steps.prerelease.outputs.value == 'true' }}
